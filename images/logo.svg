<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 350" width="100%" height="100%">
  <!-- MY WATERPROOFING Official Brand Vector Logo (Transparent Canvas, Zero Clipping Lines) -->
  <defs>
    <linearGradient id="myBlueGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#164688" />
      <stop offset="100%" stop-color="#1b58a1" />
    </linearGradient>
  </defs>

  <!-- 1. Left Vertical Pillar (Corporate Blue) -->
  <rect x="30" y="20" width="44" height="230" rx="2" fill="url(#myBlueGrad)" />

  <!-- 2. 'M' Container -->
  <!-- Crisp White Negative-Space 'M' (Guarantees M is brilliant pure white on dark surfaces) -->
  <polygon points="164,20 227,20 294,145 361,20 424,20 424,95 361,250 294,250 227,250 164,95" fill="#ffffff" />
  <!-- Top Center Downward Triangle of M -->
  <polygon points="227,20 361,20 294,145" fill="url(#myBlueGrad)" />
  <!-- Bottom Left Wedge of M -->
  <polygon points="164,95 227,250 164,250" fill="url(#myBlueGrad)" />
  <!-- Bottom Right Wedge of M -->
  <polygon points="424,95 361,250 424,250" fill="url(#myBlueGrad)" />

  <!-- 3. 'Y' Container -->
  <!-- Crisp White Negative-Space 'Y' (Guarantees Y is brilliant pure white on dark surfaces) -->
  <polygon points="514,20 638,20 744,145 744,250 674,250 674,165 514,20" fill="#ffffff" />
  <polygon points="974,20 850,20 744,145 744,250 814,250 814,165 974,20" fill="#ffffff" />
  <!-- Top Center Downward Triangle of Y -->
  <polygon points="638,20 850,20 744,120" fill="url(#myBlueGrad)" />
  <!-- Left Polygon of Y (straight outer edge, diagonal inner edge to stem) -->
  <polygon points="514,20 514,250 674,250 674,165" fill="url(#myBlueGrad)" />
  <!-- Right Polygon of Y (straight outer edge, diagonal inner edge to stem) -->
  <polygon points="974,20 974,250 814,250 814,165" fill="url(#myBlueGrad)" />

  <!-- 4. Wordmark 'WATERPROOFING' (Bright Cyan with Wide Tracking) -->
  <text x="502" y="325" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
        font-size="64" 
        font-weight="800" 
        letter-spacing="24" 
        fill="#00b4d8" 
        text-anchor="middle">WATERPROOFING</text>
</svg>
