<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- MY WATERPROOFING Official Monogram Favicon (MY Monogram Only) -->
  <defs>
    <linearGradient id="favBlueGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#164688" />
      <stop offset="100%" stop-color="#1b58a1" />
    </linearGradient>
    <linearGradient id="favBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1528" />
      <stop offset="100%" stop-color="#111d35" />
    </linearGradient>
  </defs>

  <!-- High-contrast Navy Squircle Badge (Ensures crisp visibility in both Light & Dark browser tabs) -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="url(#favBgGrad)" />

  <!-- Monogram Group Scaled & Centered (Width 400, Height 140, Centered at x=56, y=186) -->
  <g transform="translate(46, 171) scale(0.42)">
    <!-- 1. Left Vertical Pillar -->
    <rect x="30" y="20" width="44" height="230" rx="2" fill="url(#favBlueGrad)" />

    <!-- 2. 'M' Container -->
    <polygon points="164,20 227,20 294,145 361,20 424,20 424,95 361,250 294,250 227,250 164,95" fill="#ffffff" />
    <polygon points="227,20 361,20 294,145" fill="url(#favBlueGrad)" />
    <polygon points="164,95 227,250 164,250" fill="url(#favBlueGrad)" />
    <polygon points="424,95 361,250 424,250" fill="url(#favBlueGrad)" />

    <!-- 3. 'Y' Container -->
    <polygon points="514,20 638,20 744,145 744,250 674,250 674,165 514,20" fill="#ffffff" />
    <polygon points="974,20 850,20 744,145 744,250 814,250 814,165 974,20" fill="#ffffff" />
    <polygon points="638,20 850,20 744,120" fill="url(#favBlueGrad)" />
    <polygon points="514,20 514,250 674,250 674,165" fill="url(#favBlueGrad)" />
    <polygon points="974,20 974,250 814,250 814,165" fill="url(#favBlueGrad)" />
  </g>
</svg>
